name: Deploy delivery_map_mapbox to お名前.com

on:
  push:
    branches:
      - main
    paths:
      - 'delivery_map_mapbox/**'
      - '.github/workflows/deploy-delivery-map.yml'
  workflow_dispatch:  # 手動実行ボタンも有効化

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP for Web Push dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Install Web Push dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --working-dir=delivery_map_mapbox

      - name: Prepare test-only Cloud Vision secret
        env:
          GOOGLE_CLOUD_VISION_TEST_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_TEST_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CLOUD_VISION_TEST_API_KEY" ]; then
            echo "Cloud Vision test secret is not configured; keeping the existing fallback."
            exit 0
          fi
          php -r '
            $key = trim((string)getenv("GOOGLE_CLOUD_VISION_TEST_API_KEY"));
            if (!preg_match("/^AIza[0-9A-Za-z_-]{30,}$/", $key)) {
              fwrite(STDERR, "Cloud Vision test secret has an invalid format.\n");
              exit(1);
            }
            $guard = "if (isset(\$_SERVER[\"SCRIPT_FILENAME\"]) && realpath(\$_SERVER[\"SCRIPT_FILENAME\"]) === __FILE__) { http_response_code(404); exit; }";
            $contents = "<?php\n// Generated by GitHub Actions. Never commit this file.\n{$guard}\nreturn " . var_export($key, true) . ";\n";
            if (file_put_contents("delivery_map_mapbox/api/vision_test_secret.deploy.php", $contents) === false) {
              fwrite(STDERR, "Could not prepare the Cloud Vision test secret.\n");
              exit(1);
            }
          '

      - name: FTP Deploy to お名前.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./delivery_map_mapbox/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/config.php
            **/*.runtime.php
            **/.git*
            **/node_modules/**
            **/data/private/*.json
            **/game/tools/**
            **/vendor/**/.github/**
            **/vendor/**/docs/**
            **/vendor/**/test/**
            **/vendor/**/tests/**
            **/vendor/**/*.md
            **/vendor/**/LICENSE*
            **/vendor/**/composer.json
            **/vendor/**/*.lock
            **/vendor/**/*.neon
            **/vendor/**/*.xml
            **/vendor/**/.coveralls.yml
            **/vendor/**/.styleci.yml
            **/vendor/**/.travis.yml
          log-level: standard

      - name: Refresh spot pickup cache
        continue-on-error: true
        run: |
          if [ -n "$SPOT_PICKUP_REFRESH_URL" ]; then
            curl --fail --show-error --silent --max-time 60 "$SPOT_PICKUP_REFRESH_URL"
          else
            echo "SPOT_PICKUP_REFRESH_URL is not set; skipping spot pickup refresh."
          fi
        env:
          SPOT_PICKUP_REFRESH_URL: ${{ secrets.SPOT_PICKUP_REFRESH_URL }}
