name: Suspend stable delivery map only
run-name: Suspend stable delivery map ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Approved immutable stable-only suspension commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delivery-map-stable-suspension
  cancel-in-progress: false
env:
  APPROVED_CANDIDATE: 6ab4cae468a1003bb7c6a11b7056bbff9bd4ee01
  APPROVED_BASE: 0a730ee5d8f6b93f3facdb64ec8c475d7ac86b60
  APPROVED_HTML_SHA256: 2725b052f010c069fcf42b8c0327a216ea4efdaeecb3232ad746e50d40474c5e
  APPROVED_WORKER_SHA256: af9768b4f5e78541aeba610d16b5ac7a392d4fbd392660632eee75215781612e
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  suspend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate fixed candidate
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" == "$APPROVED_CANDIDATE" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate scope and regressions
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$APPROVED_BASE" HEAD
          git diff --name-only "$APPROVED_BASE" HEAD > /tmp/stable-suspension-paths
          node -e 'const fs=require("fs"),a=require("assert/strict");const allowed=new Set(["delivery_map_mapbox/index.html","delivery_map_mapbox/service-worker.js","delivery_map_mapbox/STABLE_SUSPENSION.md","scripts/test-delivery-stable-suspension.mjs","scripts/publish-delivery-stable-suspension.cjs"]);const changed=fs.readFileSync("/tmp/stable-suspension-paths","utf8").trim().split("\n");a.equal(changed.length,5);a.ok(changed.every(p=>allowed.has(p)));'
          node --test scripts/test-delivery-stable-suspension.mjs scripts/test-delivery-marker-overlap.mjs scripts/test-delivery-route-visibility.mjs scripts/test-delivery-block-numbers.mjs scripts/test-delivery-geocoding.mjs
          node scripts/test-delivery-gps-map-return.mjs
          mkdir -p /tmp/delivery-stable-suspension
          for file in index.html service-worker.js test/index.html test/service-worker.js; do
            output="$(printf '%s' "$file" | tr / _)"
            git show "$APPROVED_BASE:delivery_map_mapbox/$file" > "/tmp/delivery-stable-suspension/expected-$output"
          done
      - name: Read and verify backups before any upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          PREPARE_ONLY: 'true'
        run: node scripts/publish-delivery-stable-suspension.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-stable-suspension-before
          path: /tmp/delivery-stable-suspension/
          retention-days: 30
      - name: Suspend only the two stable files with FTPS verification
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: node scripts/publish-delivery-stable-suspension.cjs
      - name: Preserve result and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-stable-suspension-publication
          path: /tmp/delivery-stable-suspension/
          retention-days: 30
