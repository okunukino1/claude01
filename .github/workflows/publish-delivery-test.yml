name: Publish delivery test single file
run-name: Publish delivery test.128 ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Approved immutable test.128 commit
        required: true
        type: string
      inspect_only:
        description: Read-only inspection without upload or rename
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-map-test-single-file
  cancel-in-progress: false

env:
  APPROVED_CANDIDATE: 4b9e77b6b7c6e93420c941ea137ae72e1ad75219
  APPROVED_BASE: b42d4bc594d63e37a7a333c53b023fd5e9ad2b18
  APPROVED_HTML_SHA256: b042c0322675844b56435984e9ba3de8700f6f14cc87002c81157c922d53e7f5
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate approved candidate
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" == "$APPROVED_CANDIDATE" ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source scope and regression tests
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$APPROVED_BASE" HEAD
          git diff --name-only "$APPROVED_BASE" HEAD > /tmp/delivery-test-changed-paths
          if grep -Ev '^(delivery_map_mapbox/test/index.html|delivery_map_mapbox/CODEX_CHANGES.md|scripts/test-delivery-route-visibility.mjs|scripts/test-delivery-marker-overlap.mjs)$' /tmp/delivery-test-changed-paths; then
            echo 'Candidate contains unexpected paths.' >&2
            exit 1
          fi
          if grep -q 'development-requests' delivery_map_mapbox/test/index.html; then exit 1; fi
          test "$(grep -c 'v2026.06.24-test.128' delivery_map_mapbox/test/index.html)" = 3
          node -e 'const fs=require("fs"),c=require("crypto"),a=require("assert/strict");const s=fs.readFileSync("delivery_map_mapbox/test/index.html","utf8").replaceAll("\r\n","\n");a.equal(c.createHash("sha256").update(s).digest("hex"),process.env.APPROVED_HTML_SHA256);'
          node --test scripts/test-delivery-marker-overlap.mjs scripts/test-delivery-route-visibility.mjs scripts/test-delivery-block-numbers.mjs scripts/test-delivery-geocoding.mjs
          node scripts/test-delivery-gps-map-return.mjs
          mkdir -p /tmp/delivery-test-publication
          git show "$APPROVED_BASE:delivery_map_mapbox/test/index.html" > /tmp/delivery-test-publication/expected-test.html
          git show "$APPROVED_BASE:delivery_map_mapbox/index.html" > /tmp/delivery-test-publication/expected-stable.html

      - name: Preserve and verify current public files
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "https://rys-services.com/delivery_map_mapbox/test/?before=$GITHUB_RUN_ID" -o /tmp/delivery-test-publication/before.html
          curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "https://rys-services.com/delivery_map_mapbox/?before=$GITHUB_RUN_ID" -o /tmp/delivery-test-publication/stable-before.html
          node <<'NODE'
          const fs=require('fs'),a=require('assert/strict');
          const read=f=>fs.readFileSync('/tmp/delivery-test-publication/'+f,'utf8').replaceAll('\r\n','\n');
          a.equal(read('before.html'),read('expected-test.html'),'Public test changed; refusing to overwrite');
          a.equal(read('stable-before.html'),read('expected-stable.html'),'Public stable differs from baseline');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: delivery-test-128-before
          path: /tmp/delivery-test-publication/
          retention-days: 30

      - name: Publish only test index with verified FTPS staging
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),{spawnSync}=require('child_process');
          const dir='/tmp/delivery-test-publication',source='delivery_map_mapbox/test/index.html';
          const normalize=b=>Buffer.isBuffer(b)?b.toString('utf8').replaceAll('\r\n','\n'):b.replaceAll('\r\n','\n');
          const digest=b=>crypto.createHash('sha256').update(normalize(b)).digest('hex');
          const before=fs.readFileSync(path.join(dir,'before.html'));
          const stable=fs.readFileSync(path.join(dir,'stable-before.html'));
          const candidate=fs.readFileSync(source),expected=process.env.APPROVED_HTML_SHA256;
          const id=process.env.GITHUB_RUN_ID,temporary=`index.test-128-${id}.html`,rollback=`index.rollback-128-${id}.html`;
          const result={version:'v2026.06.24-test.128',candidate:process.env.CANDIDATE_SHA,published:false,filesPublished:0,realApiCalls:0,cleanupComplete:true};
          let credentialsValid=false,stagingAttempted=false,promotionAttempted=false;
          const quote=v=>'"'+String(v).replaceAll('\\','\\\\').replaceAll('"','\\"')+'"';
          let root;
          function ftp(filename,options=[]) {
            const lines=['silent','show-error','fail','ssl-reqd','connect-timeout = 20','max-time = 60','retry = 0',
              'url = '+quote(`ftp://${process.env.FTP_SERVER}/${root}/test/${filename}`),
              'user = '+quote(process.env.FTP_USERNAME+':'+process.env.FTP_PASSWORD)];
            for(const [key,value] of options) lines.push(value===true?key:key+' = '+quote(value));
            const call=spawnSync('curl',['-q','--config','-'],{input:lines.join('\n')+'\n',encoding:'utf8',timeout:70000,maxBuffer:2*1024*1024});
            if(call.error||call.status!==0) {
              let details=String(call.stderr||call.error?.message||'').slice(0,600);
              for(const key of ['FTP_PASSWORD','FTP_USERNAME','FTP_SERVER','FTP_REMOTE_DIR']) if(process.env[key]) details=details.replaceAll(process.env[key],'[redacted]');
              throw new Error(`FTPS operation failed (curl ${call.status}): ${details}`);
            }
            return call.stdout;
          }
          async function http(relative,label) {
            const response=await fetch('https://rys-services.com/delivery_map_mapbox/'+relative+'?publication='+id+'-'+label,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
            if(!response.ok) throw new Error(`Public verification failed: ${label} HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }
          function requireHash(actual,wanted,label) {if(digest(actual)!==digest(wanted)) throw new Error(label+' hash mismatch');}
          function promote(filename,expectedBytes) {
            const output=path.join(dir,filename===temporary?'ftp-after.html':'ftp-restored.html');
            ftp('index.html',[['quote','RNFR '+root+'/test/'+filename],['quote','RNTO '+root+'/test/index.html'],['output',output]]);
            if(!fs.readFileSync(output).equals(expectedBytes)) throw new Error('Renamed FTP file does not match expected bytes');
          }
          async function settledPublic(relative,label,wanted,previous) {
            for(const delay of [0,2000,5000,10000]) {
              if(delay) await new Promise(resolve=>setTimeout(resolve,delay));
              const actual=await http(relative,label+'-'+delay);
              if(digest(actual)===digest(wanted)) return actual;
              if(digest(actual)!==digest(previous)) throw new Error(label+' returned an unexpected third-party file');
            }
            throw new Error(label+' did not refresh to expected bytes');
          }
          (async()=>{
            try {
              if(!/^\d+$/.test(id)) throw new Error('Invalid run identifier');
              root=String(process.env.FTP_REMOTE_DIR||'').replace(/^\.\//,'').replace(/^\/+/,'').replace(/\/+$/,'');
              if(process.env.FTP_SERVER!=='www1106.onamae.ne.jp'||root!=='rys-services.com/delivery_map_mapbox') throw new Error('FTP destination is outside the approved site');
              if(!process.env.FTP_USERNAME||!process.env.FTP_PASSWORD||/[\r\n\0]/.test(process.env.FTP_USERNAME+process.env.FTP_PASSWORD)) throw new Error('FTP credentials missing or invalid');
              if(digest(candidate)!==expected) throw new Error('Candidate changed before publication');
              credentialsValid=true;
              ftp('index.html',[['output',path.join(dir,'ftp-before.html')]]);
              if(process.env.INSPECT_ONLY==='true') {
                const current=fs.readFileSync(path.join(dir,'ftp-before.html'));
                const names=ftp('',[['list-only',true]]).split(/\r?\n/).map(name=>name.split('/').pop());
                Object.assign(result,{inspected:true,ftpCurrentSha256:digest(current),ftpCurrentBytes:current.length,
                  testTemporaryFiles:names.filter(name=>/^index\.(?:test|rollback)-127-\d+\.html$/.test(name)||/^index\.html\.(?:test|rollback)-127-\d+\.tmp$/.test(name))});
                return;
              }
              requireHash(fs.readFileSync(path.join(dir,'ftp-before.html')),before,'FTP baseline');
              stagingAttempted=true;
              ftp(temporary,[['upload-file',source]]);
              ftp(temporary,[['output',path.join(dir,'staged.html')]]);
              if(!fs.readFileSync(path.join(dir,'staged.html')).equals(candidate)) throw new Error('Staged bytes differ from candidate');
              requireHash(await http('test/'+temporary,'public-stage'),candidate,'Staged public URL');
              requireHash(await http('test/','pre-promote'),before,'Current test before promotion');
              requireHash(await http('','stable-pre-promote'),stable,'Current stable before promotion');
              promotionAttempted=true;
              promote(temporary,candidate);
              const after=await settledPublic('test/','after',candidate,before),direct=await settledPublic('test/index.html','direct',candidate,before),stableAfter=await http('','stable-after');
              fs.writeFileSync(path.join(dir,'after.html'),after);
              fs.writeFileSync(path.join(dir,'direct-after.html'),direct);
              fs.writeFileSync(path.join(dir,'stable-after.html'),stableAfter);
              requireHash(after,candidate,'Published test');requireHash(direct,candidate,'Direct test');requireHash(stableAfter,stable,'Stable after publication');
              Object.assign(result,{published:true,filesPublished:1,sha256:digest(after),stableUnchanged:true,transport:'FTPS',publishedAt:new Date().toISOString()});
            } catch(error) {
              result.error=error.message;process.exitCode=1;
              if(promotionAttempted) {
                try {
                  ftp('index.html',[['output',path.join(dir,'ftp-rollback-check.html')]]);
                  const current=fs.readFileSync(path.join(dir,'ftp-rollback-check.html'));
                  if(digest(current)===digest(candidate)) {
                    ftp(rollback,[['upload-file',path.join(dir,'ftp-before.html')]]);
                    ftp(rollback,[['output',path.join(dir,'rollback-staged.html')]]);
                    if(!fs.readFileSync(path.join(dir,'rollback-staged.html')).equals(fs.readFileSync(path.join(dir,'ftp-before.html')))) throw new Error('Rollback staging mismatch');
                    promote(rollback,fs.readFileSync(path.join(dir,'ftp-before.html')));
                  } else if(digest(current)!==digest(before)) throw new Error('Third-party change detected; refusing rollback overwrite');
                  const restored=await settledPublic('test/','rollback-after',before,candidate);requireHash(restored,before,'Rollback');
                  fs.writeFileSync(path.join(dir,'restored.html'),restored);result.rollbackRestored=true;
                } catch(rollbackError) {result.rollbackRestored=false;result.rollbackError=rollbackError.message;}
              }
            } finally {
              if(credentialsValid&&stagingAttempted) {
                try {
                  const present=ftp('',[['list-only',true]]).split(/\r?\n/).map(name=>name.split('/').pop());
                  for(const filename of [temporary,rollback]) if(present.includes(filename)) ftp('index.html',[['quote','DELE '+root+'/test/'+filename],['output',path.join(dir,'cleanup-current.html')]]);
                  const names=ftp('',[['list-only',true]]).split(/\r?\n/).map(name=>name.split('/').pop());
                  if(names.includes(temporary)||names.includes(rollback)) throw new Error('A publication temporary file remains');
                } catch(cleanupError) {result.cleanupComplete=false;result.cleanupError=cleanupError.message;process.exitCode=1;}
              }
              fs.writeFileSync(path.join(dir,'result.json'),JSON.stringify(result,null,2)+'\n');
              console.log(JSON.stringify(result));
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE

      - name: Preserve publication evidence and rollback files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-test-128-publication
          path: /tmp/delivery-test-publication/
          retention-days: 30
