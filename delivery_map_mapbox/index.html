<!doctype html>
<html lang="ja">
<head>

  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>RYS配送マップ | 通常版は一時停止中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f7; color: #202124; font-family: system-ui, sans-serif; letter-spacing: 0; }
    header { padding: 18px 20px; background: #111111; color: white; border-bottom: 3px solid #ff5722; }
    header p { margin: 0; font-size: 18px; font-weight: 700; }
    main { width: min(100%, 600px); margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 24px; font-size: 26px; line-height: 1.5; overflow-wrap: anywhere; }
    p { margin: 0 0 16px; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
    .status { color: #a42b11; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <header><p>RYS配送マップ</p></header>
  <main>
    <p class="status">通常版・一時停止中</p>
    <h1>通常版は一時停止中です</h1>
    <p>通常版の地図・配送操作は現在利用できません。</p>
    <p>保存済みの配送先や写真を削除する変更は行っていません。</p>
  </main>
  <script>
    'use strict';
    const APP_VERSION = 'v2026.07.10-1-suspended.1';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js', { scope: './', updateViaCache: 'none' })
        .then(registration => registration.update()).catch(() => {});
    }
  </script>

</html>
