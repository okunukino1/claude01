<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>駐車許可申請 区域図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #1b1b1b;
    --line: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ecef;
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 13px;
  }

  /* ===== 画面のみのツールバー ===== */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 500;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: #fff;
    border-bottom: 1px solid #ccc;
  }
  .toolbar button, .toolbar select {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
    background: #fafafa;
    cursor: pointer;
  }
  .toolbar button.on { background: #1f6fd0; border-color: #1f6fd0; color: #fff; }
  .toolbar button:disabled { opacity: .5; cursor: progress; }
  .toolbar .spacer { flex: 1; }
  .toolbar .hint { color: #666; font-size: 12px; }

  .sheet-caption {
    width: 190mm;
    margin: 18px auto 4px;
    font-size: 12px;
    font-weight: 700;
    color: #555;
  }
  .sheet-caption .off { color: #b00; font-weight: 400; }

  /* ===== A4 用紙 ===== */
  .sheet {
    width: 190mm;
    height: 277mm;          /* A4縦 - 上下余白10mm。用紙からはみ出さないよう高さを固定する */
    overflow: hidden;
    margin: 0 auto 12px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.2);
    display: flex;
    flex-direction: column;
  }
  .sheet-title, .sheet > table.meta, .sheet > .bottom, .sheet > .foot { flex: none; }
  .sheet-title {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    letter-spacing: .08em;
    padding: 4mm 0 2mm;
  }
  table.meta {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.meta th, table.meta td {
    border: 1px solid var(--line);
    padding: 2mm 3mm;
    text-align: left;
    vertical-align: middle;
  }
  table.meta th {
    background: #f2f4f6;
    width: 26mm;
    white-space: nowrap;
    font-weight: 600;
  }
  table.meta td[contenteditable]:focus { outline: 2px solid #1f6fd0; }

  /* 地図は残りの高さをすべて使う。表題や欄の文字が増えた分は地図が縮んで吸収する */
  .map-frame {
    position: relative;
    border: 1px solid var(--line);
    border-top: none;
    flex: 1 1 auto;
    min-height: 60mm;
  }
  .map { position: absolute; inset: 0; }

  .north {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 450;
    width: 34px;
    height: 44px;
    background: rgba(255,255,255,.88);
    border: 1px solid #888;
    border-radius: 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.1;
    padding-top: 3px;
    pointer-events: none;
  }
  .north span { display: block; font-size: 18px; line-height: 1; }

  .bottom {
    display: flex;
    gap: 3mm;
    margin-top: 3mm;
    max-height: 58mm;
    overflow: hidden;
  }
  .legend, .locator-box, .spot-box {
    border: 1px solid var(--line);
    padding: 2mm 3mm;
    font-size: 11.5px;
  }
  .legend { width: 62mm; }
  .legend h4, .spot-box h4 {
    margin: 0 0 1.5mm;
    font-size: 12px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 1mm;
  }
  .legend ul { margin: 0; padding: 0; }
  .legend li {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 2mm;
    margin: 1.2mm 0;
  }
  .legend .swatch {
    width: 14px;
    height: 10px;
    border: 1.5px solid #333;
    display: inline-block;
    flex: none;
  }
  .legend .star { font-size: 14px; color: #c0272d; }
  .locator-box { width: 52mm; padding: 0; position: relative; }
  .locator { position: absolute; inset: 0; }
  .locator-cap {
    position: absolute;
    left: 0; bottom: 0;
    background: rgba(255,255,255,.85);
    font-size: 10px;
    padding: 0 3px;
    z-index: 450;
  }
  .spot-box { flex: 1; }
  table.spots { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.spots th, table.spots td { border: 1px solid #ccc; padding: 1mm 1.5mm; text-align: left; }
  table.spots th { background: #f2f4f6; }
  table.spots td.no { width: 8mm; text-align: center; }
  .spots-empty { color: #777; font-size: 11px; margin: 1mm 0 0; }
  .foot {
    margin-top: 2mm;
    font-size: 10px;
    color: #555;
    display: flex;
    justify-content: space-between;
  }

  /* ===== 地図上のラベル・マーカー ===== */
  .town-label {
    font-size: 11px;
    font-weight: 700;
    color: #17324d;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
  }
  .town-label.sub { font-size: 10px; color: #55636e; font-weight: 400; }
  .store-pin {
    font-size: 26px;
    line-height: 1;
    color: #c0272d;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    text-align: center;
  }
  .store-pin b {
    display: block;
    font-size: 11px;
    color: #111;
    background: rgba(255,255,255,.85);
    border: 1px solid #c0272d;
    border-radius: 3px;
    padding: 0 3px;
    white-space: nowrap;
  }
  .spot-pin {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #1f4fd0;
    color: #fff;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #1f4fd0;
    font-size: 12px;
    font-weight: 700;
    line-height: 19px;
    text-align: center;
  }

  @media screen {
    .sheet.hidden-sheet { display: none; }
  }
  @media print {
    body { background: #fff; }
    .toolbar, .sheet-caption, .leaflet-control-zoom, .leaflet-control-layers { display: none !important; }
    /* 100vh は印刷時の用紙内寸。余白設定を変えても1枚に収まる */
    .sheet { width: auto; height: 100vh; max-height: 100vh; margin: 0; box-shadow: none; break-before: page; }
    .sheet.first-print { break-before: auto; }
    .sheet.hidden-sheet { display: none !important; }
    @page { size: A4 portrait; margin: 10mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-print">🖨 印刷 / PDF保存</button>
  <select id="printmode" title="印刷する用紙"></select>
  <select id="profile" title="営業所"></select>
  <select id="basemap">
    <option value="pale">地理院 淡色地図</option>
    <option value="std">地理院 標準地図</option>
    <option value="photo">航空写真</option>
  </select>
  <button id="btn-geocode">🔍 住所から位置</button>
  <button id="btn-store">📍 店舗位置を設定</button>
  <button id="btn-spot">🅿 駐車予定地点を追加</button>
  <button id="btn-clear">🗑 駐車地点を全消去</button>
  <button id="btn-fit">🔄 表示範囲リセット</button>
  <span class="spacer"></span>
  <span class="hint">★や駐車地点の設定は1枚目（全体図）で行います。町別の各ページは地図をドラッグ／ズームして写る範囲を調整できます。</span>
</div>

<div id="sheets"></div>

/* ===== 営業所プロファイル =====
   対象区域を増減するときは names[] を編集する。
   store は営業所（★）の初期位置。正確な位置は画面の「店舗位置を設定」でも変更できる。 */
const chome = (town, list) => list.map(n => town + n + '丁目');
const STORE_PROFILES = {
  kobunacho: {
    name: '日本橋小舟町店',
    address: '〒103-0024 東京都中央区日本橋小舟町4-6',
    // 初期位置は小舟町の代表点（仮）。「🔍 住所から位置」または地図クリックで実際の位置に合わせる。
    store: { lat: 35.686672, lng: 139.778364 },
    groups: [
      { key: 'hongokucho', label: '日本橋本石町 1〜4丁目', color: '#d2413a', names: chome('日本橋本石町', [1, 2, 3, 4]) },
      { key: 'muromachi',  label: '日本橋室町 1〜4丁目',   color: '#2f6fbf', names: chome('日本橋室町',   [1, 2, 3, 4]) },
      { key: 'honcho',     label: '日本橋本町 1〜4丁目',   color: '#1f8f52', names: chome('日本橋本町',   [1, 2, 3, 4]) },
      { key: 'kobunacho',  label: '日本橋小舟町',          color: '#d98a20', names: ['日本橋小舟町'] }
    ]
  },
  hamacho: {
    name: '浜町店',
    address: '東京都中央区日本橋浜町',
    store: { lat: 35.687862, lng: 139.78833 },
    groups: [
      { key: 'hamacho',       label: '日本橋浜町 1〜3丁目', color: '#d2413a', names: chome('日本橋浜町', [1, 2, 3]) },
      { key: 'higashinihon',  label: '東日本橋 1〜2丁目',   color: '#2f6fbf', names: chome('東日本橋',   [1, 2]) },
      { key: 'nakasu',        label: '日本橋中洲',          color: '#d98a20', names: ['日本橋中洲'] }
    ]
  }
};

const PROFILE_KEY = (new URLSearchParams(location.search).get('store') || 'kobunacho');
const PROFILE = STORE_PROFILES[PROFILE_KEY] || STORE_PROFILES.kobunacho;
const AREA_GROUPS = PROFILE.groups;
const STORE_DEFAULT = { lat: PROFILE.store.lat, lng: PROFILE.store.lng, name: PROFILE.name };

const GSI = {
  pale:  { url: 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',           max: 18 },
  std:   { url: 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',            max: 18 },
  photo: { url: 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',  max: 18 }
};
const GSI_ATTR = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
const STORE_KEY = 'parking-permit-store-v1:' + PROFILE_KEY;
const SPOT_KEY  = 'parking-permit-spots-v1:' + PROFILE_KEY;
const SOURCE_NOTE = '背景地図：国土地理院「地理院タイル」／区域界：政府統計の総合窓口(e-Stat) 小地域境界データ';

const GROUP_BY_NAME = new Map();
AREA_GROUPS.forEach(g => g.names.forEach(n => GROUP_BY_NAME.set(n, g)));
const groupOf = (name) => GROUP_BY_NAME.get(name) || null;
const isTarget = (name) => GROUP_BY_NAME.has(name);
const featuresOf = (group) => BOUNDARIES.features.filter(f => group.names.includes(f.properties.name));

let store = loadJSON(STORE_KEY) || Object.assign({}, STORE_DEFAULT);
let spots = loadJSON(SPOT_KEY) || [];
let baseKey = 'pale';
const sheets = [];

/* ===== 用紙（シート）を組み立てる ===== */
const SHEET_SPECS = [{ kind: 'overview', group: null, caption: '全体図' }].concat(
  AREA_GROUPS.map(g => ({ kind: 'town', group: g, caption: g.label }))
);

const sheetsRoot = document.getElementById('sheets');
SHEET_SPECS.forEach((spec, index) => sheets.push(buildSheet(spec, index)));

function buildSheet(spec, index) {
  const caption = document.createElement('div');
  caption.className = 'sheet-caption';
  caption.textContent = (index + 1) + '枚目：' + spec.caption +
    (spec.kind === 'overview' ? '（申請区域の全体）' : '（拡大図）');
  sheetsRoot.appendChild(caption);

  const el = document.createElement('div');
  el.className = 'sheet';
  el.dataset.kind = spec.kind;
  const areaText = spec.kind === 'overview'
    ? '東京都中央区　' + AREA_GROUPS.map(g => g.label).join('・') + '（着色部分）'
    : '東京都中央区　' + spec.group.label + '（着色部分）';
  const titleText = spec.kind === 'overview'
    ? '駐 車 許 可 申 請　区 域 図'
    : '駐車許可申請 区域図（' + spec.group.label + '）';
  el.innerHTML = `
    <div class="sheet-title" contenteditable="true">${escapeHTML(titleText)}</div>
    <table class="meta">
      <tr>
        <th>営業所</th><td class="meta-store" contenteditable="true">${escapeHTML(PROFILE.name)}</td>
        <th>所在地</th><td class="meta-addr" contenteditable="true">${escapeHTML(PROFILE.address)}</td>
      </tr>
      <tr>
        <th>対象区域</th><td colspan="3" class="meta-area" contenteditable="true">${escapeHTML(areaText)}</td>
      </tr>
      <tr>
        <th>用途</th><td contenteditable="true">貨物の集配（積卸し）</td>
        <th>作成日</th><td class="meta-date"></td>
      </tr>
    </table>
    <div class="map-frame">
      <div class="map"></div>
      <div class="north"><span>▲</span>N</div>
    </div>
    <div class="bottom">
      <div class="legend"><h4>凡例</h4><ul></ul></div>
      <div class="locator-box"><div class="locator"></div><div class="locator-cap">位置図（${spec.kind === 'overview' ? '広域' : '申請区域全体'}）</div></div>
      <div class="spot-box">
        <h4>駐車予定地点${spec.kind === 'overview' ? '' : '（この区域内）'}</h4>
        <table class="spots" hidden><thead><tr><th class="no">No</th><th>場所・備考</th></tr></thead><tbody></tbody></table>
        <p class="spots-empty"></p>
      </div>
    </div>
    <div class="foot"><span>${SOURCE_NOTE}</span><span>縮尺：<span class="scale-note">—</span></span></div>
  `;
  sheetsRoot.appendChild(el);

  const sheet = { spec, el, index };
  setupSheetMap(sheet);
  setupSheetLocator(sheet);
  fillLegend(sheet);
  el.querySelector('.meta-date').textContent = formatToday();
  return sheet;
}

/* ===== 各シートの主図 ===== */
function setupSheetMap(sheet) {
  const spec = sheet.spec;
  const map = L.map(sheet.el.querySelector('.map'), { zoomSnap: 0.25, attributionControl: true });
  sheet.map = map;
  sheet.base = L.tileLayer(GSI[baseKey].url, { maxZoom: GSI[baseKey].max, maxNativeZoom: GSI[baseKey].max, attribution: GSI_ATTR }).addTo(map);
  L.control.scale({ imperial: false, maxWidth: 140 }).addTo(map);

  const subject = spec.kind === 'town' ? spec.group : null;
  const inSubject = (name) => !subject || groupOf(name) === subject;

  // 対象区域（このシートの主役）
  const mainLayer = L.geoJSON(BOUNDARIES, {
    filter: f => isTarget(f.properties.name) && inSubject(f.properties.name),
    style: f => {
      const g = groupOf(f.properties.name);
      return { color: g.color, weight: subject ? 3 : 2.5, opacity: 1, fillColor: g.color, fillOpacity: subject ? 0.2 : 0.22 };
    }
  }).addTo(map);

  // 申請区域のうち、このシートの主役ではない町（薄く表示）
  if (subject) {
    L.geoJSON(BOUNDARIES, {
      filter: f => isTarget(f.properties.name) && !inSubject(f.properties.name),
      style: f => ({ color: groupOf(f.properties.name).color, weight: 1.2, opacity: .8, fillColor: groupOf(f.properties.name).color, fillOpacity: 0.06 })
    }).addTo(map);
  }

  // 申請区域外
  L.geoJSON(BOUNDARIES, {
    filter: f => !isTarget(f.properties.name),
    style: { color: '#7a7a7a', weight: 1, opacity: 0.65, fill: false, dashArray: '4 3' }
  }).addTo(map);

  sheet.townLabels = BOUNDARIES.features.filter(f => isTarget(f.properties.name)).map(f => {
    const p = f.properties;
    const sub = subject && groupOf(p.name) !== subject;
    const latlng = L.latLng(p.centerLat, p.centerLng);
    const marker = L.marker(latlng, {
      interactive: false,
      icon: L.divIcon({ className: '', html: '<div class="town-label' + (sub ? ' sub' : '') + '">' + escapeHTML(sub ? p.name : p.shortName) + '</div>', iconSize: [110, 16], iconAnchor: [55, 8] })
    }).addTo(map);
    return { marker, latlng };
  });

  sheet.bounds = mainLayer.getBounds();
  sheet.fit = () => map.fitBounds(sheet.bounds, { padding: [12, 12] });
  sheet.fit();

  const scaleNote = sheet.el.querySelector('.scale-note');
  const updateScale = () => {
    const c = map.getCenter();
    const metersPerPixel = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, map.getZoom() + 8);
    const denom = Math.round(metersPerPixel / 0.00026458333 / 100) * 100;   // 1px ≒ 0.264583mm
    scaleNote.textContent = '約 1 : ' + denom.toLocaleString();
  };
  map.on('zoomend moveend', () => { updateScale(); hideLabelsUnderStore(sheet); });
  updateScale();

  if (spec.kind === 'overview') {
    map.on('click', onOverviewClick);
  }
}

/* ===== 位置図（小さい方） ===== */
function setupSheetLocator(sheet) {
  const locator = L.map(sheet.el.querySelector('.locator'), {
    zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false
  });
  L.tileLayer(GSI[baseKey].url, { maxZoom: 18 }).addTo(locator);
  sheet.locatorBase = locator;

  const all = L.geoJSON(BOUNDARIES, {
    filter: f => isTarget(f.properties.name),
    style: f => (sheet.spec.kind === 'town' && groupOf(f.properties.name) === sheet.spec.group)
      ? { color: '#c0272d', weight: 1.5, fillColor: '#c0272d', fillOpacity: 0.75 }
      : { color: '#8a8a8a', weight: 1, fillColor: '#8a8a8a', fillOpacity: 0.25 }
  }).addTo(locator);

  if (sheet.spec.kind === 'overview') {
    locator.setView(all.getBounds().getCenter(), 13);
  } else {
    locator.fitBounds(all.getBounds(), { padding: [4, 4] });
  }
}

function fillLegend(sheet) {
  const groups = sheet.spec.kind === 'overview' ? AREA_GROUPS : [sheet.spec.group];
  const rows = groups.map(g =>
    '<li><span class="swatch" style="background:' + g.color + '55;border-color:' + g.color + '"></span>' + escapeHTML(g.label) + '</li>'
  );
  if (sheet.spec.kind === 'town') {
    rows.push('<li><span class="swatch" style="background:#ffffff;border-color:#9a9a9a"></span>申請区域のうち他の町</li>');
  }
  rows.push('<li><span class="star">★</span>営業所（申請者）</li>');
  rows.push('<li><span class="spot-pin" style="width:16px;height:16px;line-height:13px;font-size:10px">1</span>駐車予定地点</li>');
  sheet.el.querySelector('.legend ul').innerHTML = rows.join('');
}

/* ===== 営業所★と駐車予定地点（全シートに反映） ===== */
function storeIconHTML() {
  return '<div class="store-pin">★<b>' + escapeHTML(store.name) + '</b></div>';
}

/* 町名ラベルが営業所★と重なったら、そのラベルだけ隠す */
function hideLabelsUnderStore(sheet) {
  if (!sheet.townLabels) return;
  const p = sheet.map.latLngToContainerPoint([store.lat, store.lng]);
  sheet.townLabels.forEach(({ marker, latlng }) => {
    const q = sheet.map.latLngToContainerPoint(latlng);
    const el = marker.getElement();
    if (el) el.style.visibility = (Math.abs(p.x - q.x) < 62 && Math.abs(p.y - q.y) < 24) ? 'hidden' : '';
  });
}

function refreshStore() {
  sheets.forEach(sheet => {
    const icon = L.divIcon({ className: '', html: storeIconHTML(), iconSize: [120, 44], iconAnchor: [60, 14] });
    if (!sheet.storeMarker) {
      sheet.storeMarker = L.marker([store.lat, store.lng], { icon, zIndexOffset: 1000, draggable: sheet.spec.kind === 'overview' }).addTo(sheet.map);
      if (sheet.spec.kind === 'overview') {
        sheet.storeMarker.dragging.disable();
        sheet.storeMarker.on('dragend', () => {
          const ll = sheet.storeMarker.getLatLng();
          store.lat = ll.lat; store.lng = ll.lng;
          saveJSON(STORE_KEY, store);
          refreshStore();
        });
      }
    } else {
      sheet.storeMarker.setIcon(icon);
      sheet.storeMarker.setLatLng([store.lat, store.lng]);
    }
    hideLabelsUnderStore(sheet);
  });
}

function refreshSpots() {
  sheets.forEach(sheet => {
    (sheet.spotMarkers || []).forEach(m => sheet.map.removeLayer(m));
    sheet.spotMarkers = [];
    const editable = sheet.spec.kind === 'overview';
    spots.forEach((s, i) => {
      const m = L.marker([s.lat, s.lng], {
        draggable: editable, zIndexOffset: 900,
        icon: L.divIcon({ className: '', html: '<div class="spot-pin">' + (i + 1) + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] })
      }).addTo(sheet.map);
      if (editable) {
        m.on('dragend', () => { const ll = m.getLatLng(); s.lat = ll.lat; s.lng = ll.lng; saveJSON(SPOT_KEY, spots); refreshSpots(); });
        m.on('contextmenu', () => { spots.splice(i, 1); saveJSON(SPOT_KEY, spots); refreshSpots(); });
      }
      sheet.spotMarkers.push(m);
    });
    fillSpotTable(sheet);
  });
}

function fillSpotTable(sheet) {
  const rows = spots
    .map((s, i) => ({ s, no: i + 1 }))
    .filter(r => sheet.spec.kind === 'overview' || inGroup(r.s, sheet.spec.group));
  const table = sheet.el.querySelector('table.spots');
  const tbody = table.querySelector('tbody');
  const empty = sheet.el.querySelector('.spots-empty');
  tbody.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    td1.className = 'no'; td1.textContent = r.no;
    const td2 = document.createElement('td');
    td2.contentEditable = 'true';
    td2.textContent = r.s.memo || '';
    td2.addEventListener('input', () => {
      r.s.memo = td2.textContent.trim();
      saveJSON(SPOT_KEY, spots);
      sheets.forEach(other => { if (other !== sheet) fillSpotTable(other); });
    });
    tr.append(td1, td2);
    tbody.appendChild(tr);
  });
  table.hidden = rows.length === 0;
  empty.hidden = rows.length > 0;
  empty.textContent = sheet.spec.kind === 'overview'
    ? '「駐車予定地点を追加」を押してから地図をクリックすると、番号付きで記入できます。'
    : 'この区域内に登録された駐車予定地点はありません。';
}

function inGroup(spot, group) {
  return featuresOf(group).some(f => pointInFeature(spot.lng, spot.lat, f));
}

function pointInFeature(lng, lat, feature) {
  const g = feature.geometry;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  return polys.some(rings =>
    pointInRing(lng, lat, rings[0]) && !rings.slice(1).some(hole => pointInRing(lng, lat, hole))
  );
}

function pointInRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

refreshStore();
refreshSpots();

/* ===== 操作モード（1枚目の全体図で操作する） ===== */
let mode = null;   // null / 'store' / 'spot'
const btnStore = document.getElementById('btn-store');
const btnSpot = document.getElementById('btn-spot');
const overviewSheet = sheets[0];

function setMode(next) {
  mode = (mode === next) ? null : next;
  btnStore.classList.toggle('on', mode === 'store');
  btnSpot.classList.toggle('on', mode === 'spot');
  overviewSheet.storeMarker.dragging[mode === 'store' ? 'enable' : 'disable']();
  overviewSheet.map.getContainer().style.cursor = mode ? 'crosshair' : '';
  if (mode) overviewSheet.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
btnStore.addEventListener('click', () => setMode('store'));
btnSpot.addEventListener('click', () => setMode('spot'));

function onOverviewClick(e) {
  if (mode === 'store') {
    store.lat = e.latlng.lat; store.lng = e.latlng.lng;
    saveJSON(STORE_KEY, store);
    refreshStore();
  } else if (mode === 'spot') {
    spots.push({ lat: e.latlng.lat, lng: e.latlng.lng, memo: '' });
    saveJSON(SPOT_KEY, spots);
    refreshSpots();
  }
}

/* ===== ツールバー ===== */
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!spots.length || !confirm('駐車予定地点をすべて消去します。よろしいですか？')) return;
  spots = [];
  saveJSON(SPOT_KEY, spots);
  refreshSpots();
});

document.getElementById('btn-fit').addEventListener('click', () => {
  setMode(null);
  sheets.forEach(s => { s.map.invalidateSize(); s.fit(); });
});

document.getElementById('btn-print').addEventListener('click', () => {
  setMode(null);
  sheets.forEach(s => { s.map.invalidateSize(); s.locatorBase.invalidateSize(); });
  setTimeout(() => window.print(), 300);
});

document.getElementById('basemap').addEventListener('change', (e) => {
  baseKey = e.target.value;
  const conf = GSI[baseKey];
  sheets.forEach(s => {
    s.map.removeLayer(s.base);
    s.base = L.tileLayer(conf.url, { maxZoom: conf.max, maxNativeZoom: conf.max, attribution: GSI_ATTR }).addTo(s.map);
    s.base.bringToBack();
  });
});

/* 印刷する用紙の選択 */
const printMode = document.getElementById('printmode');
const townCount = AREA_GROUPS.length;
printMode.innerHTML = [
  ['all', '全体図＋町別（' + (townCount + 1) + '枚）'],
  ['overview', '全体図のみ（1枚）'],
  ['towns', '町別のみ（' + townCount + '枚）']
].map(([v, t]) => '<option value="' + v + '">' + t + '</option>').join('');
printMode.addEventListener('change', applyPrintMode);
function applyPrintMode() {
  const value = printMode.value;
  let first = null;
  sheets.forEach(s => {
    const hidden = (value === 'overview' && s.spec.kind !== 'overview') ||
                   (value === 'towns' && s.spec.kind !== 'town');
    s.el.classList.toggle('hidden-sheet', hidden);
    s.el.previousElementSibling.classList.toggle('hidden-caption', hidden);
    s.el.previousElementSibling.style.display = hidden ? 'none' : '';
    s.el.classList.toggle('first-print', false);
    if (!hidden && !first) first = s;
  });
  if (first) first.el.classList.add('first-print');
  sheets.forEach(s => { s.map.invalidateSize(); s.locatorBase.invalidateSize(); });
}
applyPrintMode();

/* 営業所プロファイル */
const profileSelect = document.getElementById('profile');
profileSelect.innerHTML = Object.entries(STORE_PROFILES)
  .map(([k, v]) => '<option value="' + k + '"' + (k === PROFILE_KEY ? ' selected' : '') + '>' + v.name + '</option>').join('');
profileSelect.addEventListener('change', () => { location.search = '?store=' + profileSelect.value; });

/* 営業所名は全シートで同期 */
document.querySelectorAll('.meta-store').forEach(cell => {
  cell.addEventListener('input', () => {
    store.name = cell.textContent.trim() || STORE_DEFAULT.name;
    saveJSON(STORE_KEY, store);
    document.querySelectorAll('.meta-store').forEach(other => {
      if (other !== cell) other.textContent = store.name;
    });
    refreshStore();
  });
});
if (store.name) document.querySelectorAll('.meta-store').forEach(c => { c.textContent = store.name; });

/* 所在地の住所から★の位置を合わせる（サイト上に置いたときのみ利用可） */
const GEOCODE_ENDPOINT = '../api/geocode_address.php';
document.getElementById('btn-geocode').addEventListener('click', async () => {
  const address = overviewSheet.el.querySelector('.meta-addr').textContent.trim();
  if (!address) { alert('所在地欄に住所を入力してください。'); return; }
  const btn = document.getElementById('btn-geocode');
  btn.disabled = true;
  try {
    const res = await fetch(GEOCODE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || typeof data.lat !== 'number') {
      throw new Error((data && (data.error || data.detail)) || ('HTTP ' + res.status));
    }
    setMode(null);
    store.lat = data.lat; store.lng = data.lng;
    saveJSON(STORE_KEY, store);
    refreshStore();
    overviewSheet.map.panTo([data.lat, data.lng]);
    alert('住所の位置に合わせました。\n' + (data.formatted || address) +
      (data.approx ? '\n\n※おおよその位置です。番地までの精度が必要な場合は「📍 店舗位置を設定」で微調整してください。' : ''));
  } catch (e) {
    alert('住所からの位置検索に使えませんでした。\n' + e.message +
      '\n\nこの機能は rys-services.com 上に置いたページでのみ動きます。' +
      'ローカルのファイルを開いている場合は「📍 店舗位置を設定」で地図をクリックしてください。');
  } finally {
    btn.disabled = false;
  }
});

document.title = '駐車許可申請 区域図 - ' + PROFILE.name;
window.addEventListener('beforeprint', () => {
  sheets.forEach(s => { s.map.invalidateSize(); s.locatorBase.invalidateSize(); });
});
setTimeout(() => {
  sheets.forEach(s => { s.map.invalidateSize(); s.locatorBase.invalidateSize(); s.fit(); });
}, 200);

/* ===== ユーティリティ ===== */
function formatToday() {
  const d = new Date();
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
